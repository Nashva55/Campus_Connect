<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/common.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body class="login-page">
  <div class="page-orb page-orb-one" aria-hidden="true"></div>
  <div class="page-orb page-orb-two" aria-hidden="true"></div>
  <div class="page-grid" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="login-card" id="loginCard" aria-label="CampusConnect admin login form">
      <div class="card-accent card-accent-top" aria-hidden="true"></div>
      <div class="card-accent card-accent-bottom" aria-hidden="true"></div>

      <div class="brand-lockup">
        <a href="../index.html" class="logo" aria-label="CampusConnect logo">
          <span class="logo-icon">CC</span>
          <span class="logo-text">CampusConnect</span>
        </a>
      </div>

      <header class="card-head">
        <h1>Admin login</h1>
        <p>Sign in with your admin email and password to manage student accounts.</p>
      </header>

      <form id="instructorForm" novalidate>
        <div class="field-group">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" name="adminEmail" placeholder="admin@campusconnect.com" autocomplete="email">
          <p class="field-error" id="adminEmailError" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label for="adminPass">Password</label>
            <a href="login.html" class="forgot-link">Student login</a>
          </div>
          <div class="password-wrapper">
            <input type="password" id="adminPass" name="adminPass" placeholder="Enter your admin password" autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggleAdminPassword" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye icon-eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1.5 12s3.8-7 10.5-7 10.5 7 10.5 7-3.8 7-10.5 7S1.5 12 1.5 12Z"></path>
                <circle cx="12" cy="12" r="3.2"></circle>
              </svg>
              <svg class="icon-eye icon-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 6.3A10.8 10.8 0 0 1 12 6c6.7 0 10.5 6 10.5 6a18.7 18.7 0 0 1-3.3 4.2"></path>
                <path d="M6.8 6.8C4.1 8.5 1.5 12 1.5 12s3.8 7 10.5 7c1.7 0 3.2-.4 4.5-1"></path>
                <path d="M9.9 9.9A3 3 0 0 0 9 12a3 3 0 0 0 4.8 2.4"></path>
              </svg>
            </button>
          </div>
          <p class="field-error" id="adminPasswordError" aria-live="polite"></p>
        </div>

        <button type="submit" id="adminLoginButton">
          <span class="button-text">Login as Admin</span>
          <span class="spinner" id="adminLoginSpinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="error-message" id="adminError" aria-live="polite"></p>

      <div class="card-footer">
        <span class="footer-line"></span>
        <p>Only admin accounts can access the admin panel and create student accounts.</p>
      </div>
    </section>
  </main>

  <script src="../js/common/auth-storage.js"></script>
  <script src="../js/pages/instructor-login.js"></script>
</body>
</html>
